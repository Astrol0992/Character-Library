<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Library</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#090910;color:#E2DCF5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh}
img{max-width:100%;display:block}
#app{display:flex;flex-direction:column;min-height:100vh}
.hdr{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 20px;border-bottom:1px solid rgba(120,80,220,.2);background:rgba(9,9,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:0;z-index:50}
.logo{font-size:14px;font-weight:600;color:#B09EE8;letter-spacing:.04em;white-space:nowrap}
.hdr-sep{color:rgba(120,80,220,.3)}
.hdr-name{font-size:14px;font-weight:600;color:#E2DCF5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.badge{background:rgba(120,80,220,.14);color:#A08AE0;border-radius:4px;padding:2px 7px;font-size:11px;white-space:nowrap}
.hdr-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.name-edit{background:#1C1C30;border:1px solid #7B5CF6;color:#E2DCF5;border-radius:6px;padding:4px 8px;font-size:14px;font-weight:600;outline:none;width:150px;min-width:0}
.view-tabs{display:flex;gap:3px;background:rgba(120,80,220,.1);border-radius:7px;padding:3px}
.view-tab{background:none;border:none;color:#5E5A80;cursor:pointer;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;transition:background .12s,color .12s;white-space:nowrap}
.view-tab.on{background:rgba(120,80,220,.2);color:#C4B5FD}
.content{padding:22px 20px;flex:1}
.search-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.srch{background:#111120;border:1px solid rgba(120,80,220,.2);color:#E2DCF5;border-radius:8px;padding:9px 12px;font-size:14px;outline:none;flex:1;min-width:120px;max-width:380px}
.srch::placeholder{color:#4E4A6A}
.srch:focus{border-color:#7B5CF6}
.cnt{font-size:12px;color:#4E4A6A;white-space:nowrap}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}
.char-card{background:#111120;border:1px solid rgba(120,80,220,.16);border-radius:11px;overflow:hidden;cursor:pointer;transition:border-color .14s,transform .12s,box-shadow .14s;will-change:transform;position:relative}
.char-card:hover{border-color:#7B5CF6;transform:translateY(-2px);box-shadow:0 6px 20px rgba(120,80,220,.13)}
.card-num{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.75);border-radius:5px;font-size:10px;font-weight:700;padding:2px 6px;line-height:1.4;pointer-events:none;z-index:1}
.char-thumb{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#181828}
.char-ph{width:100%;aspect-ratio:3/4;background:#181828;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.22;color:#fff}
.char-info{padding:9px 11px}
.char-name{font-size:13px;font-weight:600;color:#E2DCF5;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-ct{font-size:11px;color:#4E4A6A}
.char-grp-tag{font-size:10px;color:#7A70A8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-card{background:#111120;border:1px solid rgba(120,80,220,.16);border-radius:11px;cursor:pointer;padding:18px 16px 16px;transition:border-color .14s,transform .12s,box-shadow .14s;will-change:transform;position:relative;display:flex;flex-direction:column;gap:4px}
.group-card:hover{border-color:#7B5CF6;transform:translateY(-2px);box-shadow:0 6px 20px rgba(120,80,220,.13)}
.group-card-ug{border-color:rgba(120,80,220,.08)}
.group-card-name{font-size:15px;font-weight:600;color:#E2DCF5}
.group-card-ug .group-card-name{color:#5E5A80}
.group-card-ct{font-size:12px;color:#4E4A6A}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px}
.img-card{background:#111120;border:1px solid rgba(120,80,220,.16);border-radius:10px;overflow:hidden}
.img-hdr{padding:9px 11px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.img-lbl{font-size:13px;font-weight:600;color:#E2DCF5;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-edit-btn{background:none;border:none;color:#4E4A6A;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .1s}
.img-edit-btn:hover{color:#A08AE0}
.img-del{background:none;border:none;color:#4E4A6A;cursor:pointer;font-size:20px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .1s}
.img-del:hover{color:#F08080}
.img-wrap{position:relative;overflow:hidden}
.img-thumb{width:100%;display:block;max-height:320px;object-fit:cover;background:#181828;cursor:zoom-in;transition:opacity .15s}
.img-thumb:hover{opacity:.85}
.img-blurred{filter:blur(16px) brightness(0.6)}
.blur-cover{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.blur-cover-txt{font-size:11px;font-weight:600;color:rgba(255,255,255,.9);background:rgba(0,0,0,.55);padding:6px 11px;border-radius:6px;pointer-events:none}
.img-err{height:100px;background:#181828;display:flex;align-items:center;justify-content:center;color:#4E4A6A;font-size:12px}
.subgrp-hdr{font-size:11px;font-weight:700;color:#A08AE0;text-transform:uppercase;letter-spacing:.1em;padding:20px 0 10px;border-bottom:1px solid rgba(120,80,220,.14);margin-bottom:14px}
.subgrp-hdr:first-child{padding-top:0}
.empty{text-align:center;color:#4E4A6A;padding:70px 20px}
.empty-sym{font-size:40px;opacity:.3;margin-bottom:14px}
.empty-t{font-size:15px;color:#9088C0;margin-bottom:5px}
.empty-s{font-size:13px}
.btn{cursor:pointer;border-radius:7px;font-size:13px;font-weight:500;padding:8px 14px;border:none;transition:opacity .12s;white-space:nowrap;line-height:1.4;min-height:36px}
.btn:hover:not(:disabled){opacity:.82}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{background:#6D28D9;color:#fff}
.bg{background:transparent;color:#7A70A8;border:1px solid rgba(120,80,220,.22)}
.bg:hover:not(:disabled){color:#B8ADDF;border-color:rgba(120,80,220,.45);opacity:1}
.bd{background:rgba(220,60,60,.1);color:#F08080;border:1px solid rgba(220,60,60,.22)}
.bsuc{background:rgba(52,200,140,.1);color:#80DEB8;border:1px solid rgba(52,200,140,.22)}
.bsm{padding:7px 11px;font-size:12px;min-height:34px}
.m-back{position:fixed;inset:0;background:rgba(0,0,0,.76);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#111120;border:1px solid rgba(120,80,220,.28);border-radius:13px;padding:22px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.7);max-height:90vh;overflow-y:auto}
.m-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.m-title{font-size:15px;font-weight:600;color:#E2DCF5}
.m-x{background:none;border:none;color:#4E4A6A;cursor:pointer;font-size:22px;line-height:1;padding:0}
.m-x:hover{color:#9088C0}
.m-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.m-div{border:none;border-top:1px solid rgba(120,80,220,.14);margin:16px 0 18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:#5E5A80;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{background:#0D0D1C;border:1px solid rgba(120,80,220,.2);color:#E2DCF5;border-radius:7px;padding:9px 11px;font-size:13px;outline:none;width:100%}
.inp::placeholder{color:#4E4A6A}
.inp:focus{border-color:#7B5CF6}
textarea.inp{resize:vertical;min-height:110px;font-family:inherit;line-height:1.5}
.tab-row{display:flex;gap:3px;background:#0D0D1C;border-radius:7px;padding:3px;margin-bottom:16px}
.tab{flex:1;background:none;border:none;color:#5E5A80;cursor:pointer;padding:7px 5px;border-radius:5px;font-size:12px;font-weight:500;transition:background .12s,color .12s}
.tab.on{background:rgba(120,80,220,.18);color:#C4B5FD}
.dz{border:1.5px dashed rgba(120,80,220,.35);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:14px}
.dz:hover,.dz.over{border-color:#7B5CF6;background:rgba(120,80,220,.06)}
.dz-icon{font-size:22px;opacity:.4;margin-bottom:9px}
.dz-txt{font-size:13px;color:#7A70A8;line-height:1.6}
.dz-hint{font-size:11px;color:#4E4A6A;margin-top:5px}
.dz-spin{pointer-events:none;cursor:default}
.prev-wrap{border-radius:8px;overflow:hidden;margin-bottom:12px}
.prev-wrap img,.url-prev img{width:100%;max-height:180px;object-fit:cover;display:block}
.url-prev{border-radius:7px;overflow:hidden;background:#0D0D1C;margin-top:10px}
.bulk-note{font-size:12px;color:#4E4A6A;margin-top:5px}
.bulk-ct{font-size:12px;color:#A08AE0;margin-top:4px}
.sort-sel{background:#111120;border:1px solid rgba(120,80,220,.2);color:#E2DCF5;border-radius:7px;padding:7px 10px;font-size:12px;outline:none;cursor:pointer;min-height:34px}
.sort-sel:focus{border-color:#7B5CF6}
.chk-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.chk-row input[type=checkbox]{width:16px;height:16px;accent-color:#7B5CF6;cursor:pointer;flex-shrink:0}
.chk-row label{font-size:13px;color:#E2DCF5;cursor:pointer}
.spinner{width:28px;height:28px;border:3px solid rgba(120,80,220,.2);border-top-color:#7B5CF6;border-radius:50%;animation:spin .65s linear infinite;margin:0 auto 11px}
@keyframes spin{to{transform:rotate(360deg)}}
.gh-hint{font-size:11px;color:#5E5A80;margin-top:5px;line-height:1.5}
.gh-hint a{color:#A08AE0}
.status-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 10px;border-radius:7px;margin-top:14px}
.status-ok{background:rgba(52,200,140,.1);color:#80DEB8;border:1px solid rgba(52,200,140,.22)}
.status-err{background:rgba(220,60,60,.1);color:#F08080;border:1px solid rgba(220,60,60,.22)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lb-inner{display:flex;flex-direction:column;align-items:center;padding:0 60px;max-width:100vw;cursor:default}
.lb-img-wrap{position:relative;max-width:min(88vw,980px);max-height:78vh}
.lb-img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px;display:block;user-select:none}
.lb-img.img-blurred{filter:blur(20px) brightness(0.5);border-radius:6px}
.lb-blur-cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;z-index:2}
.lb-lbl{color:#E2DCF5;font-size:14px;font-weight:600;margin-top:12px;text-align:center;opacity:.88}
.lb-ctr{font-size:11px;color:#5E5A80;margin-top:4px}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(12,12,25,.8);border:1px solid rgba(120,80,220,.28);color:#E2DCF5;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:background .15s;padding:0;line-height:1}
.lb-nav:hover:not(:disabled){background:rgba(120,80,220,.4)}
.lb-nav:disabled{opacity:.18;cursor:default}
.lb-prev{left:10px}
.lb-next{right:10px}
.lb-x{position:fixed;top:14px;right:18px;background:none;border:none;color:#E2DCF5;font-size:26px;cursor:pointer;opacity:.5;line-height:1;padding:0}
.lb-x:hover{opacity:1}
.grp-sel{background:#0D0D1C;border:1px solid rgba(120,80,220,.2);color:#7A70A8;border-radius:6px;padding:4px 8px;font-size:11px;outline:none;cursor:pointer;max-width:110px}
.grp-sel:focus{border-color:#7B5CF6}
@media(max-width:520px){
  .hdr{padding:10px 14px;gap:6px}
  .content{padding:16px 14px}
  .search-row{gap:8px}
  .srch{max-width:none;flex:1;min-width:0}
  .char-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .img-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .group-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .lb-inner{padding:0 50px}
  .lb-prev{left:4px}
  .lb-next{right:4px}
  .btn{min-height:40px}
  .bsm{min-height:38px;padding:8px 10px}
  .sort-sel{min-height:38px}
  .modal{padding:18px}
  .hdr-name{max-width:110px}
}
</style>
</head>
<body>
<input type="file" id="file-input" accept="image/*" style="display:none">
<div id="app"></div>
<div id="modal-root"></div>
<div id="lb-root"></div>
<script>
/* CHARLIB_DATA_START */
var __D__ = {"v":0,"d":{},"g":{}};
/* CHARLIB_DATA_END */

//── STATE ─────────────────────────────────────────────────────
var chars={}, groups={};
var pg=null, view='cards', activeGroup=null;
var q='', _en=false, _env='';
var _mo=null, _mt='device', _mi='', _mu='', _mb='', _ml='', _mSubGrp='', _mBlur=false;
var _editImgId=null;
var _pendingDelGroupId=null;
var _mph=null, _tmrMd=null, _tmrPub=null;
var _loading=false;
var _lb=false, _lbIdx=0, _lbTx=null;
var _pushing=false, _pushErr='';
var _sort='az';
var _revealedImgs={};

//── INIT ──────────────────────────────────────────────────────
function init(){
  loadData();
  var vs={az:1,za:1,newest:1,oldest:1};
  try{var ss=localStorage.getItem('charlib_sort');if(ss&&vs[ss])_sort=ss;}catch(e){}
  document.getElementById('file-input').addEventListener('change',function(e){handleImgFile(e.target.files[0]);e.target.value='';});
  document.addEventListener('keydown',function(e){
    if(_lb){if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')lbPrev();if(e.key==='ArrowRight')lbNext();return;}
    if(e.key==='Escape'&&_mo)closeMod();
  });
  render();
}

//── DATA ──────────────────────────────────────────────────────
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function loadData(){
  try{
    var s=localStorage.getItem('charlib');
    if(s){var p=JSON.parse(s);if((p.v||0)>=(__D__.v||0)){chars=p.d||{};groups=p.g||{};return;}}
  }catch(e){}
  chars=JSON.parse(JSON.stringify(__D__.d||{}));
  groups=JSON.parse(JSON.stringify(__D__.g||{}));
  save();
}
function save(){try{localStorage.setItem('charlib',JSON.stringify({v:Date.now(),d:chars,g:groups}));}catch(e){console.warn('Storage full',e);}}

//── GITHUB AUTH ───────────────────────────────────────────────
async function hashPwd(pwd){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
function getPwdHash(){return localStorage.getItem('charlib_pwd_hash')||'';}
function checkAndOpenSettings(){if(getPwdHash())openMod('pwdPrompt');else openMod('ghCfg');}
async function submitPwd(){
  var inp=document.getElementById('pwd-i');if(!inp)return;
  var hash=await hashPwd(inp.value);
  if(hash===getPwdHash()){openMod('ghCfg');}
  else{inp.value='';inp.focus();var err=document.getElementById('pwd-err');if(err){err.style.display='block';err.textContent='Incorrect password.';}}
}
function loadGH(){try{var s=localStorage.getItem('charlib_gh');return s?JSON.parse(s):{token:'',owner:'',repo:'',path:'index.html'};}catch(e){return{token:'',owner:'',repo:'',path:'index.html'};}}
function saveGH(cfg){localStorage.setItem('charlib_gh',JSON.stringify(cfg));}
function ghConfigured(){var g=loadGH();return !!(g.token&&g.owner&&g.repo);}

//── UTILS ─────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sortChars(arr){
  return arr.sort(function(a,b){
    if(_sort==='za')return b.name.localeCompare(a.name);
    if(_sort==='newest')return(b.created||0)-(a.created||0);
    if(_sort==='oldest')return(a.created||0)-(b.created||0);
    return a.name.localeCompare(b.name);
  });
}
function getFiltered(){
  var lq=q.toLowerCase();
  return sortChars(Object.values(chars).filter(function(c){return c.name.toLowerCase().indexOf(lq)>-1;}));
}
function getGroupChars(groupId){
  var raw=groupId==='__ungrouped__'
    ?Object.values(chars).filter(function(c){return !c.groupId;})
    :Object.values(chars).filter(function(c){return c.groupId===groupId;});
  if(q){var lq=q.toLowerCase();raw=raw.filter(function(c){return c.name.toLowerCase().indexOf(lq)>-1;});}
  return sortChars(raw);
}
function htmlToBase64(str){
  var bytes=new TextEncoder().encode(str),bin='',chunk=8192;
  for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  return btoa(bin);
}

//── IMAGE UTILS ───────────────────────────────────────────────
async function processFile(file){
  var bmp=await createImageBitmap(file);
  try{
    if(!bmp.width||!bmp.height)throw new Error('Invalid dimensions');
    var r=Math.min(1,1000/bmp.width),cv=document.createElement('canvas');
    cv.width=Math.round(bmp.width*r);cv.height=Math.round(bmp.height*r);
    var ctx=cv.getContext('2d');if(!ctx)throw new Error('No canvas context');
    ctx.drawImage(bmp,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',0.75);
  }finally{bmp.close();}
}
function compressImg(src){
  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){var r=Math.min(1,1000/img.width),cv=document.createElement('canvas');cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.75));};
    img.onerror=function(){res(src);};img.src=src;
  });
}
function readFile(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(e){res(e.target.result);};fr.onerror=rej;fr.readAsDataURL(file);});}
async function handleImgFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  _loading=true;renderModal();
  await new Promise(function(r){setTimeout(r,0);});
  try{_mi=await processFile(file);}catch(e){try{var raw=await readFile(file);_mi=await compressImg(raw);}catch(e2){}}
  _loading=false;_mt='device';renderModal();
}

//── CAPTURE + PUBLISH ─────────────────────────────────────────
function captureHTML(){
  var ae=document.getElementById('app'),le=document.getElementById('lb-root');
  var as=ae.innerHTML,ls=le.innerHTML;
  ae.innerHTML='';le.innerHTML='';
  var raw='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  ae.innerHTML=as;le.innerHTML=ls;
  return raw;
}
async function publish(){
  if(_pushing)return;
  if(!ghConfigured()){openMod('ghCfg');return;}
  _pushing=true;_pushErr='';render();
  try{
    var g=loadGH(),path=g.path||'index.html';
    var apiUrl='https://api.github.com/repos/'+g.owner+'/'+g.repo+'/contents/'+path;
    var headers={'Authorization':'token '+g.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'};
    var sha=null,getRes=await fetch(apiUrl,{headers:headers});
    if(getRes.ok){var info=await getRes.json();sha=info.sha;}
    else if(getRes.status!==404)throw new Error('Could not read file ('+getRes.status+')');
    var newD=JSON.stringify({v:Date.now(),d:chars,g:groups}).replace(/<\/script>/gi,'<\\/script>');
    var html=captureHTML().replace(/\/\* CHARLIB_DATA_START \*\/([\s\S]*?)\/\* CHARLIB_DATA_END \*\//,'/* CHARLIB_DATA_START */\nvar __D__ = '+newD+';\n/* CHARLIB_DATA_END */');
    var body={message:'Update character library',content:htmlToBase64(html)};
    if(sha)body.sha=sha;
    var putRes=await fetch(apiUrl,{method:'PUT',headers:headers,body:JSON.stringify(body)});
    if(!putRes.ok){var err=await putRes.json();throw new Error(err.message||'GitHub API error ('+putRes.status+')');}
    _pushing=false;
    var btn=document.getElementById('pub-btn');
    if(btn){btn.innerHTML='&#10003; Published!';btn.className=btn.className.replace('bp','bsuc');clearTimeout(_tmrPub);_tmrPub=setTimeout(function(){var b=document.getElementById('pub-btn');if(b){b.innerHTML='&#8679; Publish';b.className=b.className.replace('bsuc','bp');}},3000);}
  }catch(e){_pushing=false;_pushErr=e.message||'Unknown error';render();setTimeout(function(){_pushErr='';render();},6000);}
}

//── RENDER ────────────────────────────────────────────────────
function render(){
  var aid=document.activeElement?document.activeElement.id:null;
  var ac=aid?(document.getElementById(aid)||{}).selectionStart:null;
  var content;
  if(pg)content=buildDetail(chars[pg]);
  else if(activeGroup)content=buildGroupDetail(activeGroup);
  else if(view==='groups')content=buildGroupsGrid();
  else content=buildGrid(getFiltered());
  document.getElementById('app').innerHTML='<div class="hdr">'+buildHdr()+'</div><div class="content">'+content+'</div>';
  setLazySrcs();
  if(aid){var el=document.getElementById(aid);if(el&&ac!=null){el.focus();try{el.setSelectionRange(ac,ac);}catch(e){}}}
}
function setLazySrcs(){
  var imgs=document.querySelectorAll('[data-s]');if(!imgs.length)return;
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.src=e.target.getAttribute('data-s');e.target.removeAttribute('data-s');obs.unobserve(e.target);}});},{rootMargin:'300px'});
    imgs.forEach(function(img){obs.observe(img);});
  }else{imgs.forEach(function(img){img.src=img.getAttribute('data-s');img.removeAttribute('data-s');});}
}

//── HEADER ────────────────────────────────────────────────────
function buildHdr(){
  var h='';
  if(pg||activeGroup)h+='<button class="btn bg bsm" onclick="goBack()">&#8592; Back</button>';
  if(!pg&&!activeGroup){
    h+='<span class="logo">Character Library</span>';
    h+='<div class="view-tabs"><button class="view-tab'+(view==='cards'?' on':'')+'" onclick="switchView(\'cards\')">Cards</button><button class="view-tab'+(view==='groups'?' on':'')+'" onclick="switchView(\'groups\')">Groups</button></div>';
  }else if(activeGroup&&!pg){
    h+='<span class="logo" style="color:#4E4A6A">Groups</span><span class="hdr-sep">/</span>';
    var gn=activeGroup==='__ungrouped__'?'Ungrouped':(groups[activeGroup]?groups[activeGroup].name:'');
    h+='<span class="hdr-name">'+esc(gn)+'</span>';
  }else if(pg){
    var cur=chars[pg]||{};
    var parentLabel=activeGroup?'Groups':(view==='groups'?'Groups':'Library');
    h+='<span class="logo" style="color:#4E4A6A">'+parentLabel+'</span><span class="hdr-sep">/</span>';
    if(_en){
      h+='<input id="en-i" class="name-edit" value="'+esc(_env)+'" oninput="_env=this.value" onkeydown="enKey(event)">';
      h+='<button class="btn bsuc bsm" onclick="saveName()">Save</button>';
      h+='<button class="btn bg bsm" onclick="_en=false;render()">Cancel</button>';
    }else{
      h+='<span class="hdr-name">'+esc(cur.name||'')+'</span>';
      h+='<button class="btn bg bsm" onclick="startEn()" title="Rename">&#9998;</button>';
    }
    // Group assignment dropdown
    h+='<select class="grp-sel" onchange="assignGroup(\''+pg+'\',this.value)" title="Assign to group">';
    h+='<option value=""'+(!cur.groupId?' selected':'')+'>No group</option>';
    Object.values(groups).sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(g){
      h+='<option value="'+g.id+'"'+(cur.groupId===g.id?' selected':'')+'>'+esc(g.name)+'</option>';
    });
    h+='</select>';
    h+='<span class="badge">'+(cur.images?cur.images.length:0)+' images</span>';
  }
  h+='<div class="hdr-actions">';
  if(pg&&chars[pg]){
    h+='<button id="md-btn" class="btn bg bsm" onclick="copyMD()">&#8860; Rentry MD</button>';
    h+='<button class="btn bp bsm" onclick="openMod(\'addImg\')">+ Add Image</button>';
    h+='<button class="btn bd bsm" onclick="openMod(\'confirmDel\')">Delete</button>';
  }else if(view==='groups'&&activeGroup&&activeGroup!=='__ungrouped__'){
    h+='<button class="btn bp bsm" onclick="openMod(\'addChar\')">+ New Character</button>';
    h+='<button class="btn bd bsm" onclick="confirmDelGroup(\''+activeGroup+'\')">Delete Group</button>';
  }else if(view==='groups'&&!pg&&!activeGroup){
    h+='<button class="btn bp bsm" onclick="openMod(\'addGroup\')">+ New Group</button>';
  }else{
    if(_pushErr)h+='<span style="font-size:11px;color:#F08080;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(_pushErr)+'">&#9888; '+esc(_pushErr)+'</span>';
    h+='<button class="btn bg bsm" title="GitHub settings" onclick="checkAndOpenSettings()">&#9881;</button>';
    h+='<button class="btn bg bsm" onclick="dl()">&#8595;</button>';
    h+='<button id="pub-btn" class="btn bp bsm" onclick="publish()"'+((_pushing||_pushErr)?' disabled':'')+' style="min-width:90px">';
    if(_pushing)h+='<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;display:inline-block"></span>Publishing\u2026</span>';
    else h+='&#8679; Publish';
    h+='</button>';
    h+='<button class="btn bp bsm" onclick="openMod(\'addChar\')">+ New Character</button>';
  }
  h+='</div>';
  return h;
}

//── CARDS VIEW ────────────────────────────────────────────────
function buildGrid(fl){
  var sortOpts=[['az','A \u2192 Z'],['za','Z \u2192 A'],['newest','Newest'],['oldest','Oldest']];
  var h='<div class="search-row"><input id="srch" class="srch" placeholder="Search characters..." value="'+esc(q)+'" oninput="q=this.value;render()">';
  h+='<select class="sort-sel" onchange="setSort(this.value)">';
  sortOpts.forEach(function(o){h+='<option value="'+o[0]+'"'+(_sort===o[0]?' selected':'')+'>'+o[1]+'</option>';});
  h+='</select>';
  h+='<button class="btn bg bsm" onclick="randomChar()"'+(fl.length?'':' disabled')+' title="Random">&#8645; Random</button>';
  h+='<span class="cnt">'+fl.length+' character'+(fl.length!==1?'s':'')+'</span></div>';
  if(!fl.length){
    h+='<div class="empty">';
    if(q)h+='<div class="empty-t">No results for &ldquo;'+esc(q)+'&rdquo;</div><div class="empty-s">Try a different name.</div>';
    else h+='<div class="empty-sym">&#9672;</div><div class="empty-t">Library is empty</div><div class="empty-s">Click &ldquo;+ New Character&rdquo; to get started.</div>';
    h+='</div>';
  }else{
    h+='<div class="char-grid">';
    fl.forEach(function(c,idx){h+=charCard(c,idx+1);});
    h+='</div>';
  }
  return h;
}
function charCard(c,num){
  var t=c.images&&c.images[0],grp=c.groupId&&groups[c.groupId];
  var h='<div class="char-card" onclick="pg=\''+c.id+'\';_en=false;render()">';
  h+='<div class="card-num">'+num+'</div>';
  if(t)h+='<img data-s="'+esc(t.url)+'" class="char-thumb" alt="'+esc(c.name)+'" decoding="async" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">';
  h+='<div class="char-ph" style="display:'+(t?'none':'flex')+'">&#9672;</div>';
  h+='<div class="char-info"><div class="char-name">'+esc(c.name)+'</div>';
  h+='<div class="char-ct">'+(c.images?c.images.length:0)+' image'+((c.images&&c.images.length!==1)?'s':'')+'</div>';
  if(grp)h+='<div class="char-grp-tag">'+esc(grp.name)+'</div>';
  h+='</div></div>';
  return h;
}

//── GROUPS VIEW ───────────────────────────────────────────────
function buildGroupsGrid(){
  var lq=q.toLowerCase();
  var allGroupsFiltered=Object.values(groups).filter(function(g){return g.name.toLowerCase().indexOf(lq)>-1;}).sort(function(a,b){return a.name.localeCompare(b.name);});
  var ungrouped=Object.values(chars).filter(function(c){return !c.groupId;});
  var totalGroups=Object.keys(groups).length;
  // Single-pass count map
  var groupCounts={};
  Object.values(chars).forEach(function(c){if(c.groupId)groupCounts[c.groupId]=(groupCounts[c.groupId]||0)+1;});
  var h='<div class="search-row"><input id="srch" class="srch" placeholder="Search groups..." value="'+esc(q)+'" oninput="q=this.value;render()">';
  h+='<span class="cnt">'+allGroupsFiltered.length+' group'+(allGroupsFiltered.length!==1?'s':'')+'</span></div>';
  var hasAnyContent=totalGroups>0||ungrouped.length>0;
  if(!hasAnyContent){
    h+='<div class="empty"><div class="empty-sym">&#9674;</div><div class="empty-t">No groups yet</div><div class="empty-s">Click &ldquo;+ New Group&rdquo; to create one.</div></div>';
    return h;
  }
  var ungroupedVisible=ungrouped.length>0&&(!q||'ungrouped'.indexOf(lq)>-1);
  if(!allGroupsFiltered.length&&!ungroupedVisible){
    h+='<div class="empty"><div class="empty-t">No groups match &ldquo;'+esc(q)+'&rdquo;</div><div class="empty-s">Try a different search term.</div></div>';
    return h;
  }
  h+='<div class="group-grid">';
  allGroupsFiltered.forEach(function(g,idx){
    var ct=groupCounts[g.id]||0;
    h+='<div class="group-card" onclick="openGroup(\''+g.id+'\')">';
    h+='<div class="card-num">'+(idx+1)+'</div>';
    h+='<div class="group-card-name">'+esc(g.name)+'</div>';
    h+='<div class="group-card-ct">'+ct+' character'+(ct!==1?'s':'')+'</div>';
    h+='</div>';
  });
  if(ungroupedVisible){
    h+='<div class="group-card group-card-ug" onclick="openGroup(\'__ungrouped__\')">';
    h+='<div class="card-num">'+(allGroupsFiltered.length+1)+'</div>';
    h+='<div class="group-card-name">Ungrouped</div>';
    h+='<div class="group-card-ct">'+ungrouped.length+' character'+(ungrouped.length!==1?'s':'')+'</div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function buildGroupDetail(groupId){
  var fl=getGroupChars(groupId);
  var sortOpts=[['az','A \u2192 Z'],['za','Z \u2192 A'],['newest','Newest'],['oldest','Oldest']];
  var h='<div class="search-row"><input id="srch" class="srch" placeholder="Search in group..." value="'+esc(q)+'" oninput="q=this.value;render()">';
  h+='<select class="sort-sel" onchange="setSort(this.value)">';
  sortOpts.forEach(function(o){h+='<option value="'+o[0]+'"'+(_sort===o[0]?' selected':'')+'>'+o[1]+'</option>';});
  h+='</select>';
  h+='<button class="btn bg bsm" onclick="randomChar()"'+(fl.length?'':' disabled')+' title="Random">&#8645; Random</button>';
  h+='<span class="cnt">'+fl.length+' character'+(fl.length!==1?'s':'')+'</span></div>';
  if(!fl.length){
    h+='<div class="empty"><div class="empty-sym">&#9672;</div><div class="empty-t">'+(q?'No results':'Empty group')+'</div>';
    if(!q)h+='<div class="empty-s">Add characters and assign them to this group.</div>';
    h+='</div>';
  }else{
    h+='<div class="char-grid">';
    fl.forEach(function(c,idx){h+=charCard(c,idx+1);});
    h+='</div>';
  }

}

//── CHARACTER DETAIL ──────────────────────────────────────────
function buildDetail(cur){
  if(!cur)return '<div class="empty"><div class="empty-t">Not found.</div></div>';
  if(!cur.images||!cur.images.length)return '<div class="empty"><div class="empty-sym">&#9633;</div><div class="empty-t">No images yet</div><div class="empty-s">Click &ldquo;+ Add Image&rdquo;.</div></div>';
  // Group images by sub-group, preserving order and original indices
  var sections=[],sectionMap={};
  cur.images.forEach(function(img,idx){
    var sg=img.subGroup||'';
    if(sectionMap[sg]===undefined){sectionMap[sg]=sections.length;sections.push({name:sg,items:[]});}
    sections[sectionMap[sg]].items.push({img:img,idx:idx});
  });
  var h='';
  sections.forEach(function(sec){
    if(sec.name)h+='<div class="subgrp-hdr">'+esc(sec.name)+'</div>';
    h+='<div class="img-grid">';
    sec.items.forEach(function(item){
      var img=item.img,origIdx=item.idx;
      var isBlurred=img.blurred&&!_revealedImgs[img.id];
      h+='<div class="img-card"><div class="img-hdr"><span class="img-lbl">'+esc(img.label)+'</span>';
      h+='<button class="img-edit-btn" onclick="openEditImg(\''+img.id+'\')" title="Edit">&#9998;</button>';
      h+='<button class="img-del" onclick="delImg(\''+img.id+'\')" title="Remove">&#215;</button></div>';
      h+='<div class="img-wrap" id="iwrap-'+img.id+'">';
      h+='<img id="iimg-'+img.id+'" data-s="'+esc(img.url)+'" class="img-thumb'+(isBlurred?' img-blurred':'')+'" alt="'+esc(img.label)+'" decoding="async"';
      h+=' onclick="maybeOpenLightbox('+origIdx+',\''+img.id+'\')"';
      if(!isBlurred)h+=' onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'"';
      h+='>';
      if(isBlurred)h+='<div id="iover-'+img.id+'" class="blur-cover" onclick="toggleReveal(\''+img.id+'\')"><div class="blur-cover-txt">&#128274; Click to reveal</div></div>';
      else h+='<div class="img-err" style="display:none">Failed to load</div>';
      h+='</div></div>';
    });
    h+='</div>';
  });
  return h;
}

//── LIGHTBOX ──────────────────────────────────────────────────
function openLightbox(idx){_lb=true;_lbIdx=idx;renderLightbox();}
function closeLightbox(){_lb=false;document.getElementById('lb-root').innerHTML='';}
function lbPrev(){if(_lbIdx>0){_lbIdx--;renderLightbox();}}
function lbNext(){var im=pg?chars[pg].images:[];if(_lbIdx<im.length-1){_lbIdx++;renderLightbox();}}
function lbReveal(imgId){_revealedImgs[imgId]=true;renderLightbox();}
function maybeOpenLightbox(idx,imgId){
  var imgs=pg&&chars[pg]&&chars[pg].images;if(!imgs)return;
  var img=imgs[idx];if(!img)return;
  if(img.blurred&&!_revealedImgs[imgId])toggleReveal(imgId);
  else openLightbox(idx);
}
function renderLightbox(){
  if(!_lb||!pg||!chars[pg])return;
  var imgs=chars[pg].images,img=imgs[_lbIdx];if(!img)return;
  var isBlurred=img.blurred&&!_revealedImgs[img.id];
  var h='<div class="lb" onclick="if(event.target===this)closeLightbox()">';
  h+='<button class="lb-x" onclick="closeLightbox()">&#215;</button>';
  h+='<button class="lb-nav lb-prev" onclick="lbPrev()"'+(_lbIdx>0?'':' disabled')+'>&#8592;</button>';
  h+='<div class="lb-inner"><div class="lb-img-wrap">';
  h+='<img id="lb-el" class="lb-img'+(isBlurred?' img-blurred':'')+'" alt="'+esc(img.label)+'" decoding="async">';
  if(isBlurred)h+='<div class="lb-blur-cover blur-cover" onclick="lbReveal(\''+img.id+'\')"><div class="blur-cover-txt">&#128274; Click to reveal</div></div>';
  h+='</div>';
  h+='<div class="lb-lbl">'+esc(img.label)+'</div>';
  if(imgs.length>1)h+='<div class="lb-ctr">'+(_lbIdx+1)+' / '+imgs.length+'</div>';
  h+='</div><button class="lb-nav lb-next" onclick="lbNext()"'+(_lbIdx<imgs.length-1?'':' disabled')+'>&#8594;</button></div>';
  document.getElementById('lb-root').innerHTML=h;
  var el=document.getElementById('lb-el');if(el)el.src=img.url;
  var lb=document.querySelector('.lb');
  if(lb){
    lb.addEventListener('touchstart',function(e){_lbTx=e.touches[0].clientX;},{passive:true});
    lb.addEventListener('touchend',function(e){if(_lbTx===null)return;var dx=e.changedTouches[0].clientX-_lbTx;if(dx>50)lbPrev();else if(dx<-50)lbNext();_lbTx=null;});
  }
}

//── MODAL RENDER ──────────────────────────────────────────────
function renderModal(){
  if(!_mo){document.getElementById('modal-root').innerHTML='';return;}
  var cur=pg?chars[pg]:null;
  var inner;
  if(_mo==='addChar')inner=modAddChar();
  else if(_mo==='addImg')inner=modAddImg(cur);
  else if(_mo==='ghCfg')inner=modGHCfg();
  else if(_mo==='pwdPrompt')inner=modPwdPrompt();
  else if(_mo==='addGroup')inner=modAddGroup();
  else if(_mo==='editImg')inner=modEditImg(cur);
  else if(_mo==='confirmDel')inner=modConfirmDel(cur);
  else if(_mo==='confirmDelGroup')inner=modConfirmDelGroup();
  else inner='';
  document.getElementById('modal-root').innerHTML='<div class="m-back" onclick="if(event.target===this)closeMod()"><div class="modal">'+inner+'</div></div>';
  if(_mi){var pe=document.getElementById('img-prev-el');if(pe)pe.src=_mi;}
  if(_mu){var ue=document.getElementById('url-prev-el');if(ue)ue.src=_mu;}
  if(_mo==='addImg')setupImgListeners();
  setTimeout(function(){
    var sel=_mo==='pwdPrompt'?'#modal-root input[type=password]':'#modal-root input:not([type=file]):not([type=password]):not([type=checkbox])';
    var fi=document.querySelector(sel);if(fi&&document.activeElement!==fi)fi.focus();
  },30);
}
function mhdr(t){return '<div class="m-hdr"><h2 class="m-title">'+esc(t)+'</h2><button class="m-x" onclick="closeMod()">&#215;</button></div>';}

//── MODAL BUILDERS ────────────────────────────────────────────
function modAddChar(){
  var gVals=Object.values(groups).sort(function(a,b){return a.name.localeCompare(b.name);});
  var preGroup=activeGroup&&activeGroup!=='__ungrouped__'?activeGroup:'';
  var h=mhdr('New character');
  h+='<div class="field"><label>Name</label><input id="nc-i" class="inp" placeholder="e.g. John" onkeydown="if(event.key===\'Enter\')addChar()"></div>';
  h+='<div class="field"><label>Group <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(optional)</span></label>';
  h+='<select id="nc-g" class="sort-sel" style="width:100%"><option value="">No group</option>';
  gVals.forEach(function(g){h+='<option value="'+g.id+'"'+(preGroup===g.id?' selected':'')+'>'+esc(g.name)+'</option>';});
  h+='</select></div>';
  h+='<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bp" onclick="addChar()">Create</button></div>';
  return h;
}
function modAddImg(cur){
  var char=cur||{},sgNames={};
  if(char.images)(char.images).forEach(function(i){if(i.subGroup)sgNames[i.subGroup]=1;});
  var sgList=Object.keys(sgNames);
  var h=mhdr('Add image'+(cur?' \u2014 '+esc(cur.name):''));
  h+='<div class="tab-row">';
  [['device','From device'],['url','From URL'],['bulk','Bulk URLs']].forEach(function(t){
    h+='<button class="tab'+(_mt===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  h+='</div>';
  if(_mt==='device'){
    if(_loading)h+='<div class="dz dz-spin"><div class="spinner"></div><div class="dz-txt">Processing\u2026</div></div>';
    else if(_mi){h+='<div class="prev-wrap"><img id="img-prev-el" style="width:100%;max-height:180px;object-fit:cover;display:block"></div>';h+='<button class="btn bg bsm" style="margin-bottom:14px" onclick="_mi=\'\';renderModal()">&#215; Clear</button>';}
    else h+='<div id="dz" class="dz"><div class="dz-icon">&#8679;</div><div class="dz-txt">Click to browse or drag an image here</div><div class="dz-hint">Right-click any image &rarr; Copy Image, then Ctrl+V / Cmd+V</div></div>';
  }
  if(_mt==='url'){
    h+='<div class="field"><label>Image URL</label><input id="url-i" class="inp" placeholder="https://i.imgur.com/\u2026" value="'+esc(_mu)+'" oninput="onUrl(this.value)" onkeydown="if(event.key===\'Enter\')addSingle()"></div>';
    h+='<div id="url-prev-wrap">'+(_mu.trim()?'<div class="url-prev"><img id="url-prev-el" style="width:100%;max-height:170px;object-fit:cover;display:block"></div>':'')+'</div>';
  }
  if(_mt==='bulk'){
    var bc=_mb.split('\n').map(function(u){return u.trim();}).filter(Boolean).length;
    h+='<div class="field"><label>URLs <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(one per line)</span></label>';
    h+='<textarea id="bulk-ta" class="inp" placeholder="https://i.imgur.com/abc.jpg&#10;\u2026" oninput="onBulk(this.value)">'+esc(_mb)+'</textarea>';
    h+='<div id="bulk-note">'+(bc>0?'<span class="bulk-ct">'+bc+' image'+(bc!==1?'s':'')+' ready</span>':'<span class="bulk-note">Paste image URLs, one per line.</span>')+'</div></div>';
    h+='<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button id="add-btn" class="btn bp" onclick="addBulk()"'+(bc>0?'':' disabled')+'>Add '+(bc>0?bc:'')+' Image'+(bc!==1?'s':'')+'</button></div>';
    return h;
  }
  // Label + sub-group + blur fields (device + url tabs)
  h+='<div class="field"><label>Label <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(optional)</span></label><input id="lbl-i" class="inp" placeholder="e.g. Default, Combat\u2026" value="'+esc(_ml)+'" oninput="_ml=this.value"></div>';
  h+='<div class="field"><label>Sub-group <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(optional)</span></label>';
  h+='<input id="sg-i" class="inp" list="sg-suggestions" placeholder="e.g. Relaxed, Angry\u2026" value="'+esc(_mSubGrp)+'" oninput="_mSubGrp=this.value">';
  if(sgList.length){h+='<datalist id="sg-suggestions">';sgList.forEach(function(sg){h+='<option value="'+esc(sg)+'">';});h+='</datalist>';}
  h+='</div>';
  h+='<div class="chk-row"><input type="checkbox" id="blur-i"'+(_mBlur?' checked':'')+' onchange="_mBlur=this.checked"><label for="blur-i">Blur by default (NSFW / sensitive)</label></div>';
  var canAdd=_mt==='url'?!!_mu.trim():!!_mi&&!_loading;
  h+='<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button id="add-btn" class="btn bp" onclick="addSingle()"'+(canAdd?'':' disabled')+'>Add</button></div>';
  return h;
}
function modAddGroup(){
  return mhdr('New group')+
    '<div class="field"><label>Name</label><input id="ng-i" class="inp" placeholder="e.g. Fantasy, Sci-Fi\u2026" onkeydown="if(event.key===\'Enter\')addGroup()"></div>'+
    '<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bp" onclick="addGroup()">Create</button></div>';
}
function modEditImg(cur){
  var img=cur&&cur.images&&cur.images.find(function(i){return i.id===_editImgId;});
  if(!img)return mhdr('Edit image')+'<p style="color:#7A70A8;font-size:13px">Image not found.</p><div class="m-foot"><button class="btn bg" onclick="closeMod()">Close</button></div>';
  var sgNames={};
  if(cur.images)cur.images.forEach(function(i){if(i.subGroup)sgNames[i.subGroup]=1;});
  var sgList=Object.keys(sgNames);
  var h=mhdr('Edit image');
  h+='<div class="field"><label>Label</label><input id="ei-lbl" class="inp" value="'+esc(img.label||'')+'" placeholder="Label\u2026"></div>';
  h+='<div class="field"><label>Sub-group <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(optional)</span></label>';
  h+='<input id="ei-sg" class="inp" list="ei-sg-list" value="'+esc(img.subGroup||'')+'" placeholder="e.g. Relaxed, Angry\u2026">';
  if(sgList.length){h+='<datalist id="ei-sg-list">';sgList.forEach(function(sg){h+='<option value="'+esc(sg)+'">';});h+='</datalist>';}
  h+='</div>';
  h+='<div class="chk-row"><input type="checkbox" id="ei-blur"'+(img.blurred?' checked':'')+' ><label for="ei-blur">Blur by default (NSFW / sensitive)</label></div>';
  h+='<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bp" onclick="saveEditImg()">Save</button></div>';
  return h;
}
function modConfirmDel(cur){
  return mhdr('Delete character?')+
    '<p style="font-size:13px;color:#7A70A8;line-height:1.6;margin-bottom:4px">Delete <strong style="color:#E2DCF5">'+esc(cur?cur.name:'')+'</strong> and all '+(cur?cur.images.length:0)+' images? This cannot be undone.</p>'+
    '<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bd" onclick="delChar()">Delete</button></div>';
}
function modConfirmDelGroup(){
  var gid=_pendingDelGroupId,g=groups[gid],ct=g?Object.values(chars).filter(function(c){return c.groupId===gid;}).length:0;
  return mhdr('Delete group?')+
    '<p style="font-size:13px;color:#7A70A8;line-height:1.6;margin-bottom:4px">Delete <strong style="color:#E2DCF5">'+esc(g?g.name:'')+' </strong>? The '+ct+' character'+(ct!==1?'s':'')+' inside will become ungrouped.</p>'+
    '<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bd" onclick="deleteGroup(\''+gid+'\')">Delete</button></div>';
}
function modGHCfg(){
  var g=loadGH(),hasPwd=!!getPwdHash();
  var h=mhdr('GitHub auto-publish setup');
  h+='<div class="field"><label>Personal access token</label><input type="password" id="gh-token" class="inp" placeholder="github_pat_\u2026" value="'+esc(g.token||'')+'" autocomplete="off">';
  h+='<div class="gh-hint">Go to <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">GitHub &rarr; Settings &rarr; Developer settings &rarr; Fine-grained tokens</a>. Give <strong>Contents</strong> Read &amp; write on your library repo.</div></div>';
  h+='<div class="field"><label>Repository owner</label><input id="gh-owner" class="inp" placeholder="your GitHub username" value="'+esc(g.owner||'')+'"></div>';
  h+='<div class="field"><label>Repository name</label><input id="gh-repo" class="inp" placeholder="e.g. Character-Library" value="'+esc(g.repo||'')+'"></div>';
  h+='<div class="field"><label>File path <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(default: index.html)</span></label><input id="gh-path" class="inp" placeholder="index.html" value="'+esc(g.path||'index.html')+'"></div>';
  h+='<hr class="m-div">';
  h+='<div class="field"><label>'+(hasPwd?'Change password':'Set access password')+' <span style="text-transform:none;letter-spacing:0;color:#4E4A6A">(leave blank to keep current)</span></label>';
  h+='<input type="password" id="gh-pwd" class="inp" placeholder="'+(hasPwd?'New password\u2026':'Set a password\u2026')+'" autocomplete="new-password"></div>';
  h+='<div class="field"><label>Confirm password</label><input type="password" id="gh-pwd2" class="inp" placeholder="Confirm\u2026" autocomplete="new-password"></div>';
  h+='<div class="gh-hint">Forget your password? Clear this page\'s browser site data to reset.</div>';
  h+='<div id="gh-status"></div>';
  h+='<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bp" onclick="testAndSave()">Test &amp; Save</button></div>';
  return h;
}
function modPwdPrompt(){
  return mhdr('Settings password')+
    '<div class="field"><label>Password</label><input type="password" id="pwd-i" class="inp" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" onkeydown="if(event.key===\'Enter\')submitPwd()" autocomplete="off"></div>'+
    '<div id="pwd-err" style="display:none;font-size:12px;color:#F08080;margin-bottom:12px"></div>'+
    '<div class="m-foot"><button class="btn bg" onclick="closeMod()">Cancel</button><button class="btn bp" onclick="submitPwd()">Unlock</button></div>';
}

//── MODAL EVENTS ──────────────────────────────────────────────
function openMod(type){
  _mo=type;
  if(type!=='ghCfg'&&type!=='pwdPrompt'&&type!=='confirmDelGroup'&&type!=='editImg'){_mt='device';_mi='';_mu='';_mb='';_ml='';_mSubGrp='';_mBlur=false;_loading=false;}
  renderModal();
}
function closeMod(){
  if(_mph){document.removeEventListener('paste',_mph);_mph=null;}
  _mo=null;_mi='';_mu='';_mb='';_ml='';_mSubGrp='';_mBlur=false;_loading=false;_editImgId=null;_pendingDelGroupId=null;
  document.getElementById('modal-root').innerHTML='';
}
function setTab(t){_mt=t;_mi='';_loading=false;renderModal();}
function onUrl(val){
  _mu=val;
  var w=document.getElementById('url-prev-wrap'),b=document.getElementById('add-btn');
  if(w){if(val.trim()){w.innerHTML='<div class="url-prev"><img id="url-prev-el" style="width:100%;max-height:170px;object-fit:cover;display:block"></div>';document.getElementById('url-prev-el').src=val.trim();}else{w.innerHTML='';}}
  if(b)b.disabled=!val.trim();
}
function onBulk(val){
  _mb=val;
  var bc=val.split('\n').map(function(u){return u.trim();}).filter(Boolean).length;
  var n=document.getElementById('bulk-note'),b=document.getElementById('add-btn');
  if(n)n.innerHTML=bc>0?'<span class="bulk-ct">'+bc+' image'+(bc!==1?'s':'')+' ready</span>':'<span class="bulk-note">Paste image URLs, one per line.</span>';
  if(b){b.disabled=bc===0;b.textContent='Add '+(bc>0?bc:'')+' Image'+(bc!==1?'s':'');}
}
async function testAndSave(){
  var token=(document.getElementById('gh-token')||{}).value||'';
  var owner=(document.getElementById('gh-owner')||{}).value||'';
  var repo=(document.getElementById('gh-repo')||{}).value||'';
  var path=(document.getElementById('gh-path')||{}).value||'index.html';
  var pwd=(document.getElementById('gh-pwd')||{}).value||'';
  var pwd2=(document.getElementById('gh-pwd2')||{}).value||'';
  var st=document.getElementById('gh-status');
  if(!token||!owner||!repo){if(st)st.innerHTML='<div class="status-row status-err">Please fill in all required fields.</div>';return;}
  if(pwd||pwd2){if(pwd!==pwd2){if(st)st.innerHTML='<div class="status-row status-err">Passwords do not match.</div>';return;}if(pwd.length<8){if(st)st.innerHTML='<div class="status-row status-err">Password must be at least 8 characters.</div>';return;}}
  if(st)st.innerHTML='<div class="status-row" style="background:rgba(120,80,220,.1);color:#A08AE0;border:1px solid rgba(120,80,220,.2)"><span style="width:12px;height:12px;border:2px solid rgba(160,138,224,.3);border-top-color:#A08AE0;border-radius:50%;animation:spin .65s linear infinite;display:inline-block;margin-right:6px"></span>Testing\u2026</div>';
  try{
    var res=await fetch('https://api.github.com/repos/'+owner+'/'+repo,{headers:{'Authorization':'token '+token}});
    if(!res.ok){var e=await res.json();throw new Error(e.message||'Status '+res.status);}
    saveGH({token:token,owner:owner,repo:repo,path:path});
    if(pwd)localStorage.setItem('charlib_pwd_hash',await hashPwd(pwd));
    if(st)st.innerHTML='<div class="status-row status-ok">&#10003; Connected to '+esc(owner+'/'+repo)+'. Saved.</div>';
    setTimeout(function(){closeMod();render();},1500);
  }catch(e){if(st)st.innerHTML='<div class="status-row status-err">&#9888; '+esc(e.message)+'</div>';}
}
function setupImgListeners(){
  var dz=document.getElementById('dz');
  if(dz){dz.onclick=function(){document.getElementById('file-input').click();};dz.ondragover=function(e){e.preventDefault();dz.classList.add('over');};dz.ondragleave=function(){dz.classList.remove('over');};dz.ondrop=function(e){e.preventDefault();dz.classList.remove('over');handleImgFile(e.dataTransfer.files[0]);};}
  if(_mph)document.removeEventListener('paste',_mph);
  _mph=async function(e){
    var items=Array.from((e.clipboardData||{}).items||[]);
    var it=items.find(function(i){return i.type.startsWith('image/');});if(!it)return;
    var file=it.getAsFile();if(!file)return;
    _loading=true;renderModal();await new Promise(function(r){setTimeout(r,0);});
    try{_mi=await processFile(file);}catch(err){try{var raw=await readFile(file);_mi=await compressImg(raw);}catch(e2){}}
    _loading=false;_mt='device';renderModal();
  };
  document.addEventListener('paste',_mph);
}

//── NAVIGATION ────────────────────────────────────────────────
function goBack(){
  if(pg){pg=null;_en=false;render();return;}
  if(activeGroup){activeGroup=null;q='';render();return;}
}
function switchView(v){view=v;activeGroup=null;pg=null;_en=false;q='';render();}
function openGroup(id){activeGroup=id;q='';render();}
function randomChar(){
  var pool=activeGroup?getGroupChars(activeGroup):getFiltered();
  if(!pool.length)return;
  var pick=pool[Math.floor(Math.random()*pool.length)];
  pg=pick.id;_en=false;render();
}
function setSort(val){_sort=val;try{localStorage.setItem('charlib_sort',val);}catch(e){}render();}
function startEn(){_env=pg&&chars[pg]?chars[pg].name:'';_en=true;render();setTimeout(function(){var el=document.getElementById('en-i');if(el)el.focus();},10);}
function enKey(e){if(e.key==='Enter')saveName();if(e.key==='Escape'){_en=false;render();}}
function saveName(){if(_env.trim()&&pg){chars[pg].name=_env.trim();save();}_en=false;render();}

//── CRUD CHARS ────────────────────────────────────────────────
function addChar(){
  var el=document.getElementById('nc-i');if(!el||!el.value.trim())return;
  var grpEl=document.getElementById('nc-g');
  var id=genId();
  chars[id]={id:id,name:el.value.trim(),images:[],created:Date.now(),groupId:(grpEl?grpEl.value||null:null)};
  save();closeMod();render();
}
function delChar(){if(!pg)return;delete chars[pg];pg=null;save();closeMod();render();}
function assignGroup(charId,groupId){if(!chars[charId])return;chars[charId].groupId=groupId||null;save();render();}

//── CRUD GROUPS ───────────────────────────────────────────────
function addGroup(){
  var el=document.getElementById('ng-i');if(!el||!el.value.trim())return;
  var id=genId();groups[id]={id:id,name:el.value.trim(),created:Date.now()};
  save();closeMod();render();
}
function confirmDelGroup(groupId){_pendingDelGroupId=groupId;openMod('confirmDelGroup');}
function deleteGroup(groupId){
  Object.values(chars).forEach(function(c){if(c.groupId===groupId)c.groupId=null;});
  delete groups[groupId];activeGroup=null;
  save();closeMod();render();
}

//── CRUD IMAGES ───────────────────────────────────────────────
function delImg(imgId){
  if(!pg||!chars[pg])return;
  chars[pg].images=chars[pg].images.filter(function(i){return i.id!==imgId;});
  save();render();
}
function addSingle(){
  var src=_mt==='url'?_mu.trim():_mi;if(!src||!pg)return;
  var li=document.getElementById('lbl-i'),sgi=document.getElementById('sg-i'),bli=document.getElementById('blur-i');
  var lbl=(li?li.value.trim():'')||_ml.trim()||'Image';
  var sg=(sgi?sgi.value.trim():'')||_mSubGrp.trim();
  var isBlur=bli?bli.checked:_mBlur;
  chars[pg].images.push({id:genId(),label:lbl,url:src,subGroup:sg,blurred:isBlur});
  save();closeMod();render();
}
function addBulk(){
  var ta=document.getElementById('bulk-ta');
  var urls=((ta?ta.value:_mb)).split('\n').map(function(u){return u.trim();}).filter(Boolean);
  if(!urls.length||!pg)return;
  var base=chars[pg].images.length;
  urls.forEach(function(url,i){chars[pg].images.push({id:genId(),label:'Image '+(base+i+1),url:url,subGroup:'',blurred:false});});
  save();closeMod();render();
}
function openEditImg(imgId){_editImgId=imgId;openMod('editImg');}
function saveEditImg(){
  var cur=pg&&chars[pg];if(!cur)return;
  var img=cur.images.find(function(i){return i.id===_editImgId;});if(!img)return;
  var lbl=(document.getElementById('ei-lbl')||{}).value||'';
  var sg=(document.getElementById('ei-sg')||{}).value||'';
  var blur=!!((document.getElementById('ei-blur')||{}).checked);
  img.label=lbl.trim()||img.label;
  img.subGroup=sg.trim();
  img.blurred=blur;
  if(!blur)delete _revealedImgs[img.id];
  save();closeMod();render();
}
function toggleReveal(imgId){
  _revealedImgs[imgId]=!_revealedImgs[imgId];
  var imgEl=document.getElementById('iimg-'+imgId);
  var overEl=document.getElementById('iover-'+imgId);
  if(_revealedImgs[imgId]){
    if(imgEl)imgEl.classList.remove('img-blurred');
    if(overEl)overEl.style.display='none';
  }else{
    if(imgEl)imgEl.classList.add('img-blurred');
    if(overEl)overEl.style.display='flex';
  }
}

//── COPY + DOWNLOAD ───────────────────────────────────────────
function copyMD(){
  var c=pg?chars[pg]:null;if(!c)return;
  var md='## '+c.name+'\n\n'+c.images.map(function(i){return'### '+i.label+'\n!['+i.label+']('+i.url+')';}).join('\n\n');
  var done=function(){var btn=document.getElementById('md-btn');if(btn){btn.innerHTML='&#10003; Copied!';btn.className=btn.className.replace('bg','bsuc');}clearTimeout(_tmrMd);_tmrMd=setTimeout(function(){var b=document.getElementById('md-btn');if(b){b.innerHTML='&#8860; Rentry MD';b.className=b.className.replace('bsuc','bg');}},2500);};
  try{navigator.clipboard.writeText(md).then(done).catch(function(){fbCopy(md);done();});}catch(e){fbCopy(md);done();}
}
function fbCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function dl(){
  if(_lb)closeLightbox();if(_mo)closeMod();
  var newD=JSON.stringify({v:Date.now(),d:chars,g:groups}).replace(/<\/script>/gi,'<\\/script>');
  var out=captureHTML().replace(/\/\* CHARLIB_DATA_START \*\/([\s\S]*?)\/\* CHARLIB_DATA_END \*\//,'/* CHARLIB_DATA_START */\nvar __D__ = '+newD+';\n/* CHARLIB_DATA_END */');
  var blob=new Blob([out],{type:'text/html'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='character-library.html';a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

init();
</script>
